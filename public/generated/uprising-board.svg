<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240" role="img" aria-label="沙丘起义固定完整盘面">
  <defs>
    <linearGradient id="boardBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10282b"/>
      <stop offset="0.42" stop-color="#3e3b30"/>
      <stop offset="0.74" stop-color="#a86236"/>
      <stop offset="1" stop-color="#d6b46a"/>
    </linearGradient>
    <linearGradient id="sandGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ba72" stop-opacity="0.18"/>
      <stop offset="0.56" stop-color="#b47a40" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5b3325" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="landsraad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243f3c"/>
      <stop offset="1" stop-color="#10262a"/>
    </linearGradient>
    <linearGradient id="arrakisCity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#735943"/>
      <stop offset="1" stop-color="#443629"/>
    </linearGradient>
    <linearGradient id="arrakisDesert" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a66d38"/>
      <stop offset="1" stop-color="#d1a357"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#041013" flood-opacity="0.45"/>
    </filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M4 28 C20 20 34 34 50 25 S70 20 78 28" fill="none" stroke="#ffe0a0" stroke-opacity="0.12"/>
      <path d="M0 58 C18 49 33 63 54 54 S70 49 80 57" fill="none" stroke="#4f2c20" stroke-opacity="0.15"/>
    </pattern>
    <style>
      .title{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:900;letter-spacing:0;fill:#f7e7bd}
      .small{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:800;letter-spacing:0;fill:#e7d49e}
      .tiny{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;letter-spacing:0;fill:#ead9b0}
      .muted{fill:#bea76e}
      .map-label{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:900;letter-spacing:0;fill:#f7e7bd;fill-opacity:.22}
      .map-label-sub{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:800;letter-spacing:0;fill:#ead9b0;fill-opacity:.18}
      .panel{stroke:#e4c775;stroke-opacity:.45;stroke-width:2;filter:url(#softShadow)}
      .route{fill:none;stroke:#f7e4a9;stroke-opacity:.3;stroke-width:3;stroke-dasharray:10 12;stroke-linecap:round}
      .shield{fill:none;stroke:#e6d091;stroke-width:12;stroke-opacity:.55;stroke-linecap:round}
      .shield-edge{fill:none;stroke:#2c3430;stroke-width:22;stroke-opacity:.38;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1600" height="1240" rx="28" fill="url(#boardBase)"/>
  <rect width="1600" height="1240" rx="28" fill="url(#grain)" opacity=".85"/>
  <path d="M0 1000 C220 900 405 1005 590 915 C815 800 980 930 1160 820 C1320 720 1465 760 1600 690 L1600 1240 L0 1240 Z" fill="url(#sandGlow)"/>
  <path d="M32 32 H1568 V1208 H32 Z" fill="none" stroke="#f0d58a" stroke-opacity=".32" stroke-width="4"/>

  <text x="58" y="62" class="title" font-size="28">DUNE UPRISING</text>
  <text x="58" y="95" class="small" font-size="18">固定完整盘面 / Scroll Board</text>

  <g id="faction-panels">
    <path class="panel" d="M70 110 H404 L430 138 V318 H70 Z" fill="#384342" fill-opacity=".82"/>
    <text x="88" y="300" class="map-label" font-size="20">皇帝</text>

    <path class="panel" d="M70 334 H418 L444 364 V642 H70 Z" fill="#692b31" fill-opacity=".84"/>
    <text x="94" y="624" class="map-label" font-size="20">宇航公会</text>

    <path class="panel" d="M70 660 H406 L432 690 V936 H70 Z" fill="#4a315b" fill-opacity=".86"/>
    <text x="94" y="918" class="map-label" font-size="20">姐妹会</text>

    <path class="panel" d="M70 960 H406 L432 990 V1220 H70 Z" fill="#255c70" fill-opacity=".86"/>
    <text x="94" y="1202" class="map-label" font-size="20">弗雷曼</text>
  </g>

  <g id="landsraad">
    <path class="panel" d="M520 78 H1132 L1160 110 V424 H500 V102 Z" fill="url(#landsraad)" fill-opacity=".92"/>
    <path class="route" d="M610 196 C720 162 870 162 1000 196"/>
    <path class="route" d="M610 310 C755 260 900 260 1030 310"/>
  </g>

  <g id="contracts">
    <path class="panel" d="M1180 122 H1418 L1448 154 V342 H1180 Z" fill="#543724" fill-opacity=".86"/>
    <text x="1210" y="164" class="title" font-size="24">合约</text>
    <text x="1210" y="190" class="tiny" font-size="14">CONTRACTS</text>
    <rect x="1214" y="215" width="48" height="68" rx="8" fill="#e5d1a3" fill-opacity=".28" stroke="#f0d58a" stroke-opacity=".35"/>
    <rect x="1276" y="210" width="48" height="68" rx="8" fill="#e5d1a3" fill-opacity=".28" stroke="#f0d58a" stroke-opacity=".35"/>
    <rect x="1338" y="215" width="48" height="68" rx="8" fill="#e5d1a3" fill-opacity=".28" stroke="#f0d58a" stroke-opacity=".35"/>
  </g>

  <g id="arrakis-cities">
    <path class="panel" d="M546 430 H1128 L1160 468 V692 H520 V462 Z" fill="url(#arrakisCity)" fill-opacity=".9"/>
    <path class="route" d="M696 522 C770 492 890 492 970 522"/>
    <path class="route" d="M696 646 C790 614 900 618 970 646"/>
  </g>

  <g id="shield-wall">
    <path class="shield-edge" d="M505 725 C640 682 735 716 856 696 C968 676 1058 636 1168 662"/>
    <path class="shield" d="M505 725 C640 682 735 716 856 696 C968 676 1058 636 1168 662"/>
  </g>

  <g id="arrakis-desert">
    <path class="panel" d="M540 780 H1228 L1260 816 V1160 H512 V816 Z" fill="url(#arrakisDesert)" fill-opacity=".78"/>
    <path class="route" d="M658 938 C760 888 874 955 1000 916 C1088 888 1140 872 1210 914"/>
    <path d="M1180 982 C1240 962 1303 988 1336 1042 C1285 1028 1238 1042 1196 1082 C1212 1042 1208 1008 1180 982 Z" fill="#3f241a" fill-opacity=".38"/>
  </g>

  <g id="score-track">
    <path class="panel" d="M1450 78 H1536 Q1564 78 1564 106 V936 Q1564 964 1536 964 H1450 Z" fill="#0a1d21" fill-opacity=".72"/>
    <text x="1490" y="126" class="title" font-size="22" text-anchor="middle">VP</text>
    <g class="tiny" font-size="18" text-anchor="middle">
      <text x="1490" y="184">12</text>
      <text x="1490" y="244">11</text>
      <text x="1490" y="304">10</text>
      <text x="1490" y="364">9</text>
      <text x="1490" y="424">8</text>
      <text x="1490" y="484">7</text>
      <text x="1490" y="544">6</text>
      <text x="1490" y="604">5</text>
      <text x="1490" y="664">4</text>
      <text x="1490" y="724">3</text>
      <text x="1490" y="784">2</text>
      <text x="1490" y="844">1</text>
      <text x="1490" y="904">0</text>
    </g>
  </g>

  <g id="board-notes" opacity=".58">
    <text x="1198" y="368" class="map-label" font-size="14">战斗区</text>
    <rect x="1190" y="384" width="244" height="226" rx="12" fill="none" stroke="#f0d58a" stroke-opacity=".16"/>
  </g>
</svg>
