<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1500" role="img" aria-label="沙丘起义固定完整盘面">
  <defs>
    <linearGradient id="boardBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1719"/>
      <stop offset="0.24" stop-color="#211c20"/>
      <stop offset="0.58" stop-color="#65361f"/>
      <stop offset="1" stop-color="#c58d44"/>
    </linearGradient>
    <linearGradient id="deepSpace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061114"/>
      <stop offset="1" stop-color="#342019"/>
    </linearGradient>
    <linearGradient id="landsraad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263d2b"/>
      <stop offset="1" stop-color="#132620"/>
    </linearGradient>
    <linearGradient id="choam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c4529"/>
      <stop offset="1" stop-color="#4b291f"/>
    </linearGradient>
    <linearGradient id="arrakisCity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46363a"/>
      <stop offset="0.62" stop-color="#8f6130"/>
      <stop offset="1" stop-color="#b9803d"/>
    </linearGradient>
    <linearGradient id="arrakisDesert" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b582d"/>
      <stop offset="1" stop-color="#d8a858"/>
    </linearGradient>
    <linearGradient id="battleZone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f4a29" stop-opacity=".86"/>
      <stop offset="1" stop-color="#221a17" stop-opacity=".96"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#03090a" flood-opacity=".5"/>
    </filter>
    <pattern id="grain" width="92" height="92" patternUnits="userSpaceOnUse">
      <path d="M4 34 C22 24 40 42 58 30 S80 25 92 34" fill="none" stroke="#ffe1a4" stroke-opacity=".09"/>
      <path d="M0 72 C18 61 38 78 60 66 S82 62 92 71" fill="none" stroke="#21120e" stroke-opacity=".16"/>
      <path d="M8 12 C30 3 48 16 72 9" fill="none" stroke="#9d7140" stroke-opacity=".12"/>
    </pattern>
    <style>
      .title{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:900;letter-spacing:0;fill:#f7e7bd}
      .small{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:800;letter-spacing:0;fill:#e7d49e}
      .tiny{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:800;letter-spacing:0;fill:#ead9b0}
      .panel{stroke:#e4c775;stroke-opacity:.42;stroke-width:2;filter:url(#softShadow)}
      .rail{stroke:#d6a64d;stroke-opacity:.42;stroke-width:2}
      .slot{fill:#e5d1a3;fill-opacity:.20;stroke:#f0d58a;stroke-opacity:.38;stroke-width:2}
      .route{fill:none;stroke:#f7e4a9;stroke-opacity:.28;stroke-width:4;stroke-dasharray:14 16;stroke-linecap:round}
      .shield{fill:none;stroke:#e6d091;stroke-width:13;stroke-opacity:.58;stroke-linecap:round}
      .shield-edge{fill:none;stroke:#141d1c;stroke-width:26;stroke-opacity:.46;stroke-linecap:round}
      .map-label{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:900;letter-spacing:0;fill:#f7e7bd;fill-opacity:.34}
      .map-sub{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:850;letter-spacing:0;fill:#ead9b0;fill-opacity:.26}
    </style>
  </defs>

  <rect width="1900" height="1500" rx="28" fill="url(#boardBase)"/>
  <rect width="1900" height="1500" rx="28" fill="url(#grain)" opacity=".9"/>
  <path d="M0 1015 C220 912 400 1035 620 925 C820 815 1010 882 1220 760 C1420 642 1640 690 1900 600 L1900 1500 L0 1500 Z" fill="#d4a05a" opacity=".2"/>
  <path d="M32 32 H1868 V1468 H32 Z" fill="none" stroke="#f0d58a" stroke-opacity=".32" stroke-width="4"/>

  <g id="faction-panels">
    <g id="emperor-panel">
      <rect class="rail" x="44" y="52" width="120" height="292" rx="4" fill="#171414" fill-opacity=".72"/>
      <rect x="58" y="68" width="92" height="70" rx="4" fill="#8a6a2a" fill-opacity=".72"/>
      <circle cx="104" cy="248" r="19" fill="#f0c356" fill-opacity=".92"/>
      <rect x="58" y="298" width="92" height="28" rx="2" fill="#0a0b0d" fill-opacity=".62"/>
      <text x="88" y="330" class="map-sub" font-size="12" transform="rotate(-90 88 330)">EMPEROR 皇帝</text>
      <path class="panel" d="M176 52 H418 L438 74 V344 H176 Z" fill="#342e2e" fill-opacity=".76"/>
    </g>

    <g id="guild-panel">
      <rect class="rail" x="44" y="382" width="120" height="316" rx="4" fill="#171414" fill-opacity=".72"/>
      <rect x="58" y="398" width="92" height="70" rx="4" fill="#8a6a2a" fill-opacity=".72"/>
      <circle cx="104" cy="588" r="19" fill="#f0c356" fill-opacity=".92"/>
      <rect x="58" y="648" width="92" height="28" rx="2" fill="#0a0b0d" fill-opacity=".62"/>
      <text x="88" y="674" class="map-sub" font-size="12" transform="rotate(-90 88 674)">SPACING GUILD 宇航公会</text>
      <path class="panel" d="M176 382 H418 L438 404 V698 H176 Z" fill="#682a32" fill-opacity=".82"/>
    </g>

    <g id="bene-panel">
      <rect class="rail" x="44" y="730" width="120" height="322" rx="4" fill="#171414" fill-opacity=".72"/>
      <rect x="58" y="746" width="92" height="70" rx="4" fill="#8a6a2a" fill-opacity=".72"/>
      <circle cx="104" cy="938" r="19" fill="#f0c356" fill-opacity=".92"/>
      <rect x="58" y="1002" width="92" height="28" rx="2" fill="#0a0b0d" fill-opacity=".62"/>
      <text x="88" y="1028" class="map-sub" font-size="12" transform="rotate(-90 88 1028)">BENE GESSERIT 姐妹会</text>
      <path class="panel" d="M176 730 H418 L438 752 V1052 H176 Z" fill="#4b2f5f" fill-opacity=".86"/>
    </g>

    <g id="fremen-panel">
      <rect class="rail" x="44" y="1082" width="120" height="356" rx="4" fill="#171414" fill-opacity=".72"/>
      <rect x="58" y="1098" width="92" height="70" rx="4" fill="#8a6a2a" fill-opacity=".72"/>
      <circle cx="104" cy="1272" r="19" fill="#f0c356" fill-opacity=".92"/>
      <rect x="58" y="1388" width="92" height="28" rx="2" fill="#0a0b0d" fill-opacity=".62"/>
      <text x="88" y="1414" class="map-sub" font-size="12" transform="rotate(-90 88 1414)">FREMEN 弗雷曼</text>
      <path class="panel" d="M176 1082 H418 L438 1104 V1438 H176 Z" fill="#285f75" fill-opacity=".86"/>
    </g>
  </g>

  <g id="landsraad">
    <path class="panel" d="M540 52 H1236 L1262 78 V414 H520 V78 Z" fill="url(#landsraad)" fill-opacity=".9"/>
    <text x="562" y="84" class="tiny" font-size="15">LANDSRAAD COUNCIL 兰兹拉德议会</text>
    <path class="route" d="M618 168 C724 128 868 128 978 168"/>
    <path class="route" d="M618 288 C776 238 972 240 1130 286"/>
  </g>

  <g id="contracts">
    <path class="panel" d="M1330 52 H1706 V356 H1330 Z" fill="url(#choam)" fill-opacity=".88"/>
    <text x="1350" y="88" class="tiny" font-size="15">CHOAM / CONTRACTS 合约</text>
    <rect class="slot" x="1350" y="126" width="86" height="122" rx="9"/>
    <rect class="slot" x="1442" y="126" width="86" height="122" rx="9"/>
    <rect class="slot" x="1534" y="126" width="86" height="122" rx="9"/>
    <circle cx="1680" cy="278" r="36" fill="#e8d3a2" fill-opacity=".28" stroke="#f7e7bd" stroke-opacity=".25"/>
  </g>

  <g id="arrakis-cities">
    <path class="panel" d="M570 410 H1510 L1550 450 V842 H520 V450 Z" fill="url(#arrakisCity)" fill-opacity=".78"/>
    <text x="594" y="824" class="map-label" font-size="30">阿拉基斯城邦</text>
    <text x="596" y="850" class="map-sub" font-size="16">ARRAKIS CITIES</text>
    <path class="route" d="M726 628 C858 552 994 520 1130 490 C1242 466 1374 468 1484 510"/>
    <path class="route" d="M738 734 C870 700 1010 718 1142 676 C1266 642 1398 648 1492 704"/>
    <circle cx="988" cy="700" r="116" fill="#f7e4a9" fill-opacity=".05"/>
  </g>

  <g id="shield-wall">
    <path class="shield-edge" d="M568 882 C730 838 858 868 1024 832 C1158 804 1288 748 1508 784"/>
    <path class="shield" d="M568 882 C730 838 858 868 1024 832 C1158 804 1288 748 1508 784"/>
  </g>

  <g id="arrakis-desert">
    <path class="panel" d="M546 900 H1220 L1250 934 V1338 H520 V934 Z" fill="url(#arrakisDesert)" fill-opacity=".78"/>
    <text x="564" y="1312" class="map-label" font-size="28">沙漠与造物主</text>
    <text x="566" y="1338" class="map-sub" font-size="16">DESERT / MAKER SPACES</text>
    <path class="route" d="M646 1024 C778 972 870 1030 982 992 C1072 960 1144 968 1202 1028"/>
    <path class="route" d="M696 1198 C800 1152 906 1198 1022 1170 C1110 1148 1172 1164 1224 1212"/>
    <path d="M1042 1094 C1148 1046 1234 1078 1282 1170 C1194 1146 1124 1168 1060 1248 C1094 1180 1086 1132 1042 1094 Z" fill="#3f241a" fill-opacity=".36"/>
  </g>

  <g id="battle-area">
    <path class="panel" d="M1320 934 H1660 V1338 H1320 Z" fill="url(#battleZone)" fill-opacity=".9"/>
    <text x="1350" y="984" class="title" font-size="30">战斗区</text>
    <text x="1352" y="1014" class="tiny" font-size="16">CONFLICT</text>
    <path d="M1410 1080 L1570 1260 M1570 1080 L1410 1260" fill="none" stroke="#f7e7bd" stroke-opacity=".16" stroke-width="20" stroke-linecap="round"/>
    <circle cx="1490" cy="1168" r="96" fill="none" stroke="#f7e7bd" stroke-opacity=".14" stroke-width="3"/>
  </g>

  <g id="score-track">
    <path class="panel" d="M1760 382 H1838 Q1864 382 1864 408 V1314 Q1864 1340 1838 1340 H1760 Z" fill="#0a1012" fill-opacity=".72"/>
    <text x="1799" y="426" class="title" font-size="20" text-anchor="middle">VP</text>
    <g class="tiny" font-size="20" text-anchor="middle">
      <text x="1799" y="492">12</text>
      <text x="1799" y="556">11</text>
      <text x="1799" y="620">10</text>
      <text x="1799" y="684">9</text>
      <text x="1799" y="748">8</text>
      <text x="1799" y="812">7</text>
      <text x="1799" y="876">6</text>
      <text x="1799" y="940">5</text>
      <text x="1799" y="1004">4</text>
      <text x="1799" y="1068">3</text>
      <text x="1799" y="1132">2</text>
      <text x="1799" y="1196">1</text>
      <text x="1799" y="1260">0</text>
    </g>
  </g>
</svg>
